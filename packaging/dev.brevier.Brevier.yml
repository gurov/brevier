# Flatpak: рантайм приносит GTK4, а магазин — раздачу и обновления.
#
# Собрать и получить один файл, который можно отдать человеку:
#
#     flatpak install --user flathub org.flatpak.Builder
#     flatpak install --user flathub org.gnome.Platform//49 org.gnome.Sdk//49 \
#         org.freedesktop.Sdk.Extension.rust-stable//25.08
#     flatpak run org.flatpak.Builder --force-clean --repo=packaging/repo \
#         packaging/build packaging/dev.brevier.Brevier.yml
#     flatpak build-bundle packaging/repo brevier.flatpak dev.brevier.Brevier
#
# Ставится он потом одной строкой: `flatpak install --user ./brevier.flatpak`.
#
# Сборка идёт без сети — так требует Flathub, и так же собирается здесь.
# Значит каждый крейт объявлен адресом и суммой: список делает
# `packaging/cargo-sources.py` из `Cargo.lock`, и перегонять его надо
# при каждом подъёме зависимостей.
#
# Для Flathub заменить источник `type: dir` на `type: git` с адресом
# репозитория и тегом: там собирают из объявленного состояния, а не
# из рабочего каталога.
id: dev.brevier.Brevier
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: brevier-ui

# Песочница нам почти ничего не стоит, и это записанное решение: сеть нужна
# (страницы), окно нужно, а файловая система — нет. «Сохранить как» ходит
# через портал, потому что `GtkFileDialog` портальный; доступ к дискам
# программа не просит вовсе.
finish-args:
  # Ради этого всё и затевалось: страницу надо откуда-то взять.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GTK4 рисует через GPU; без этого остаётся программная отрисовка.
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # Вендорный каталог cargo ищет здесь же, в каталоге сборки модуля.
  env:
    CARGO_HOME: /run/build/brevier/cargo

modules:
  - name: brevier
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked --features ui
      - install -Dm755 target/release/brevier-ui /app/bin/brevier-ui
      - install -Dm755 target/release/brevier /app/bin/brevier
      - install -Dm644 packaging/dev.brevier.Brevier.desktop
        /app/share/applications/dev.brevier.Brevier.desktop
      - install -Dm644 assets/brevier.svg
        /app/share/icons/hicolor/scalable/apps/dev.brevier.Brevier.svg
      - install -Dm644 packaging/dev.brevier.Brevier.metainfo.xml
        /app/share/metainfo/dev.brevier.Brevier.metainfo.xml
      # Текст OFL обязан ехать с дистрибутивом — условие лицензии на
      # гарнитуры, отдельное от нашей MIT+Apache на код.
      - install -Dm644 assets/fonts/OFL-NotoSans.txt
        /app/share/licenses/dev.brevier.Brevier/OFL-NotoSans.txt
      - install -Dm644 LICENSE-MIT /app/share/licenses/dev.brevier.Brevier/LICENSE-MIT
      - install -Dm644 LICENSE-APACHE /app/share/licenses/dev.brevier.Brevier/LICENSE-APACHE
    sources:
      - type: dir
        path: ..
        skip:
          # 19 ГБ чужой работы, которую сборке всё равно предстоит сделать
          # заново своим тулчейном.
          - target
          - .git
          - corpus/out
          - packaging/build
          - packaging/repo
          - .flatpak-builder
      - cargo-sources.json
