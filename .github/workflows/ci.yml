name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  ui:
    name: window — clippy with the GTK4 feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install GTK 4 and the desktop-file tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev desktop-file-utils
      - run: cargo clippy --all-targets --features ui -- -D warnings
      # Ломается молча: окно просто останется без иконки в панели задач.
      - run: desktop-file-validate packaging/dev.brevier.Brevier.desktop

  packaging:
    name: packaging — metadata and the crate list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y appstream
      # Без карточки пакет не примут на Flathub, а в Discover он будет
      # безымянной строкой.
      - run: appstreamcli validate --no-net packaging/dev.brevier.Brevier.metainfo.xml
      # Flatpak собирается без сети по списку крейтов. Список устаревает
      # молча — при подъёме зависимостей его надо перегонять, и узнать
      # об этом лучше здесь, а не на сборке пакета.
      - name: The crate list matches Cargo.lock
        run: |
          python3 packaging/cargo-sources.py > /tmp/cargo-sources.json
          diff -u packaging/cargo-sources.json /tmp/cargo-sources.json ||
            { echo "run packaging/cargo-sources.py > packaging/cargo-sources.json" >&2; exit 1; }
      - run: sh -n packaging/install.sh && sh -n packaging/tarball.sh

  tls:
    name: trust stays delegated to the OS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # An architectural decision, checkable by a command rather than on trust:
      # no bundled root store, so revoked CAs are the operating system's problem
      # and not a pet project's release cadence.
      - name: No webpki roots in the tree
        run: |
          if cargo tree | grep -q webpki-roots; then
            echo "webpki-roots linked in: trust must stay with the OS store" >&2
            exit 1
          fi
