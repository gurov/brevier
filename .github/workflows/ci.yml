name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  ui:
    name: window — clippy with the GTK4 feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install GTK 4 and the desktop-file tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev desktop-file-utils
      - run: cargo clippy --all-targets --features ui -- -D warnings
      # Ломается молча: окно просто останется без иконки в панели задач.
      - run: desktop-file-validate packaging/io.github.gurov.brevier.desktop

  packaging:
    name: packaging — metadata and the crate list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y appstream
      # Без карточки пакет не примут на Flathub, а в Discover он будет
      # безымянной строкой.
      - run: appstreamcli validate --no-net packaging/io.github.gurov.brevier.metainfo.xml
      # Flatpak собирается без сети по списку крейтов. Список устаревает
      # молча — при подъёме зависимостей его надо перегонять, и узнать
      # об этом лучше здесь, а не на сборке пакета.
      - name: The crate list matches Cargo.lock
        run: |
          python3 packaging/cargo-sources.py > /tmp/cargo-sources.json
          diff -u packaging/cargo-sources.json /tmp/cargo-sources.json ||
            { echo "run packaging/cargo-sources.py > packaging/cargo-sources.json" >&2; exit 1; }
      - run: sh -n packaging/install.sh && sh -n packaging/tarball.sh
      # Знак — контур с плоским градиентом; сохранение из Inkscape это ломает.
      - name: The mark is an outline with a flat gradient
        run: python3 packaging/icons.py --check

  # Подпись по DCO у каждого коммита чужого PR: откуда пришёл вклад — запись
  # в истории, а не в памяти. Подпись должна быть автора коммита, а не любая.
  dco:
    name: every commit of a pull request is signed off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Signed-off-by from the author on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=$(git log --no-merges --format='%H%x09%ae%x09%(trailers:key=Signed-off-by,valueonly,separator=%x20)%x09%s' "$BASE..$HEAD" |
            awk -F'\t' 'index($3, "<" $2 ">") == 0 { print substr($1, 1, 12) "  " $4 }')
          if [ -n "$missing" ]; then
            echo "These commits are not signed off by their author (see DCO and CONTRIBUTING.md):" >&2
            echo "$missing" >&2
            echo "To sign them off: git rebase --signoff $BASE && git push --force-with-lease" >&2
            exit 1
          fi

  action:
    name: the check as a GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Та же дверь, что у чужого сайта (`uses: gurov/brevier@…`), только
      # из своего дерева. Порог ноль: здесь проверяют Action, а не example.com.
      - id: check
        uses: ./
        with:
          urls: https://example.com/
          min: 0
          badge: brevier-check.svg
      - name: The step reports a score and draws the badge
        run: |
          test -n "${{ steps.check.outputs.score }}"
          grep -q '<svg' brevier-check.svg

  tls:
    name: trust stays delegated to the OS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # An architectural decision, checkable by a command rather than on trust:
      # no bundled root store, so revoked CAs are the operating system's problem
      # and not a pet project's release cadence.
      - name: No webpki roots in the tree
        run: |
          if cargo tree | grep -q webpki-roots; then
            echo "webpki-roots linked in: trust must stay with the OS store" >&2
            exit 1
          fi

  android:
    name: Android — the core cross-compiles and the app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rust и NDK — закреплённые, те же, что у выпуска и у F-Droid: Rust
      # называет android/rust-toolchain.toml, NDK — `ndkVersion` в Gradle.
      - name: Install the pinned Rust and NDK
        run: |
          (cd android && rustup toolchain install)
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk" || { echo "no ndkVersion in android/app/build.gradle.kts" >&2; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      # Сначала канарейка: ядро — то, что едет на телефон как есть. День,
      # когда в тракт чтения заедет зависимость с X11, fontconfig или
      # библиотекой хоста, должен быть виден здесь отдельной строкой, а не
      # потеряться в выводе Gradle. Команда та же, что зовёт Gradle: общая
      # библиотека под arm64 с фичами читалки (`save` тянет `images`).
      # Линковка тут не лишняя: она и доказывает, что ядро собирается
      # в одно целое под чужую платформу.
      - name: The core links into a shared library for arm64
        run: sh android/core.sh "$RUNNER_TEMP/core" arm64-v8a
      # Потом само приложение (`android/`): Kotlin поверх того же ядра.
      # Одна ABI — телефонная; эмуляторную x86_64 CI не гоняет.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: The app builds
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -Pabis=arm64-v8a
