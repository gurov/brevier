name: Release

# Выпуск: по тегу vX.Y.Z собрать то, что люди скачивают и ставят, — архив
# для Linux, пакет Flatpak, APK для Android, установщик и zip для Windows —
# и выложить релизом на GitHub.
# Ручной запуск (Run workflow) собирает всё то же без выкладки: так проверяют,
# что выпуск соберётся, до того как поставлен тег. Старый тег не трогаем:
# свежее — это новая версия, а не перезапись выпущенного.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: the tag names the version in Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Тег и версия расходятся — значит, забыли поднять одно из двух,
          # и файлы вышли бы с чужим номером в имени.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          # Без заметок релиз выйти не должен: их пишут до тега.
          test -f "packaging/notes/v$version.md" ||
            { echo "::error::no packaging/notes/v$version.md"; exit 1; }

  tarball:
    name: Linux — archive
    needs: version
    # Бинарник требует glibc не старее сборочной: 24.04, как и прежде.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev
      - run: packaging/tarball.sh "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  flatpak:
    name: Linux — Flatpak
    needs: version
    runs-on: ubuntu-latest
    # Рантайм тот же, что в манифесте: GNOME 49.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # Пакет собирается с `--runtime-repo` Flathub: у того, кто рантайма
      # не держит, flatpak сам предложит его забрать.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: brevier.flatpak
          manifest-path: packaging/io.github.gurov.brevier.yml
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: flatpak

  android:
    name: Android — APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rust и NDK — закреплённые (android/rust-toolchain.toml и `ndkVersion`
      # в Gradle): F-Droid собирает тем же и сверяет APK побайтно.
      - name: Install the pinned Rust and NDK
        run: |
          (cd android && rustup toolchain install)
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk" || { echo "::error::no ndkVersion in android/app/build.gradle.kts"; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Ключ выпуска живёт в секретах; в репозиторий он не едет. Gradle
      # берёт его по BREVIER_SIGNING и без него выпуск не собирает.
      - name: The signing key from the secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set"
            exit 1
          fi
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          printf '%s' "$KEYSTORE" | base64 -d > "$dir/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=brevier\n' \
            "$dir/release.jks" "$PASSWORD" > "$dir/release.properties"
          echo "BREVIER_SIGNING=$dir/release.properties" >> "$GITHUB_ENV"
      # Одна ABI — телефонная. Имя файла с версией: brevier-X.Y.Z-arm64.apk.
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -Pabis=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/brevier-*.apk
          if-no-files-found: error

  # Windows: GTK из MSYS2 (UCRT64) — тот, на котором выходят под Windows
  # GIMP и Inkscape; рядом с ним Rust и NSIS из того же репозитория. Что
  # собирается и почему — в шапке packaging/windows/build.sh.
  windows:
    name: Windows — installer and zip
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Тексты, вшитые в бинарник, — с LF, как в репозитории.
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtk-update-icon-cache
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nsis
      - run: packaging/windows/build.sh "$PWD/dist"
      # Проверка на живой Windows: поставить установщиком, как поставит
      # читатель, спросить cli, поднять окно с файлом по пути с буквой
      # диска и убедиться, что оно живо; потом удалить. Снимок экрана —
      # единственный способ увидеть шрифты на настоящей Windows: Wine
      # рисует текст по-своему.
      - name: Install it, start the window, uninstall it
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          $bin = "$env:LOCALAPPDATA\Programs\Brevier\bin"
          & "$bin\brevier.exe" --version
          if ($LASTEXITCODE) { exit 1 }
          & "$bin\brevier.exe" "$PWD\README.md" | Select-Object -First 5
          if ($LASTEXITCODE) { exit 1 }
          $ui = Start-Process -PassThru -FilePath "$bin\brevier-ui.exe" -ArgumentList "`"$PWD\README.md`""
          Start-Sleep -Seconds 20
          if ($ui.HasExited) { Write-Error "brevier-ui exited: $($ui.ExitCode)"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          New-Item -ItemType Directory -Force screenshot | Out-Null
          $shot.Save("$PWD\screenshot\windows.png")
          Stop-Process -Id $ui.Id
          Start-Process -Wait -FilePath "$env:LOCALAPPDATA\Programs\Brevier\uninstall.exe" -ArgumentList '/S'
          Start-Sleep -Seconds 5
          if (Test-Path "$bin\brevier-ui.exe") { Write-Error 'the uninstaller left the program'; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error
      # Снимок — только при ручном запуске: по тегу все артефакты уходят
      # в релиз, а снимку там не место.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag' && always()
        with:
          name: windows-screenshot
          path: screenshot/
          if-no-files-found: ignore

  # F-Droid собирает APK сам и публикует наш, подписанный, только если его
  # сборка совпала с нашей побайтно; не совпала — версия в F-Droid не выйдет.
  # Здесь та же проверка: другой каталог, другой дом cargo, сборка без подписи
  # и `apksigcopier compare`, как у F-Droid. Выкладку на GitHub она не держит:
  # тем, кто ставит из Releases, расхождение не мешает, а красная задача видна.
  reproducible:
    name: Android — the APK builds the same elsewhere
    needs: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elsewhere/brevier
    steps:
      - uses: actions/checkout@v4
        with:
          path: elsewhere/brevier
      # Rust и NDK — закреплённые (android/rust-toolchain.toml и `ndkVersion`
      # в Gradle): F-Droid собирает тем же и сверяет APK побайтно.
      - name: Install the pinned Rust and NDK
        run: |
          (cd android && rustup toolchain install)
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk" || { echo "::error::no ndkVersion in android/app/build.gradle.kts"; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - name: Another home for cargo
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the APK unsigned
        working-directory: elsewhere/brevier/android
        run: ./gradlew --no-daemon assembleRelease -Pabis=arm64-v8a -Punsigned
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/signed
      - name: Our signature fits the unsigned build
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet apksigcopier
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          PATH="$tools:$PATH" "$RUNNER_TEMP/venv/bin/apksigcopier" compare \
            "$RUNNER_TEMP"/signed/brevier-*.apk \
            --unsigned android/app/build/outputs/apk/release/brevier-*-unsigned.apk

  publish:
    name: publish the release
    needs: [version, tarball, flatpak, android, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Суммы — чтобы скачанное можно было сверить, не веря зеркалу на слово.
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Brevier $VERSION" \
            --notes-file "packaging/notes/v$VERSION.md" \
            --latest
