[package]
name = "brevier"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

# Ядро — библиотека, интерфейс и cli — потребители. Разделение записано
# в архитектуре: тулкит должен сидеть на краю.
[lib]
name = "brevier"
path = "src/lib.rs"

[[bin]]
name = "brevier"
path = "src/main.rs"

# Окно — отдельный бинарник за фичей: ядро и cli собираются без GTK,
# и корпус M0 продолжает гонять тот же `brevier`, что и раньше.
[[bin]]
name = "brevier-ui"
path = "src/ui/gtk.rs"
required-features = ["ui"]

[features]
ui = ["dep:gtk", "images", "save"]
# Декодеры картинок. Отдельной фичей, потому что корпус M0 гоняется
# бинарником `brevier` и лишние крейты ему ни к чему.
images = ["dep:image", "dep:resvg"]
# Сохранение статьи на диск: markdown, а с картинками — zip. Картинки тянет
# за собой: в архив они ложатся байтами, а искать их адреса умеет `media`.
save = ["dep:zip", "images"]

[dependencies]
comrak = { version = "0.55", default-features = false }
dom_query = "0.28"
dom_smoothie = "0.18.1"
gtk = { version = "0.11.4", package = "gtk4", optional = true }
htmd = "0.5.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
resvg = { version = "0.48.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip", "brotli", "charset"] }
url = "2.5.8"
zip = { version = "8", default-features = false, features = ["deflate-flate2"], optional = true }
